model:
  name: JiT
  type: xpred
paths:
  repo: third_party/JiT
  checkpoint_dir_env: PFC_JIT_CKPT_DIR
  default_checkpoint_dir: ckpts/JiT/JiT-B-16-256
  imagenet: /mnt/iset/nfs-main/public/datasets/ILSVRC
sampling:
  resolution: 256
  steps: official_debug
  solver: official
  time_direction: noise_to_image
  cfg_scale: 3.0
  cfg_interval:
    - 0.1
    - 1.0
evaluation:
  num_images_debug: 16
hardware:
  default_max_gpus: 2

