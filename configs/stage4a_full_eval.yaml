stage: 4A
name: full_inference_and_fid_ready_eval
paths:
  project: /mnt/iset/nfs-main/private/zhuangyifan/PixelFlowCache
  imagenet_root: /mnt/iset/nfs-main/public/datasets/ILSVRC/Data/CLS-LOC
  output_root: outputs/stage4a/full_generation
  fid_root: logs/stage4a/fid
  summary_root: logs/stage4a/summary
checkpoints:
  jit: ckpts/JiT/JiT-B-16-256/checkpoint-last.pth
  deco: ckpts/DeCo/imagenet256_epoch800/imagenet256_epoch800.ckpt
hardware:
  default_gpus: 1
  env: PFC_CUDA_DEVICES
policy:
  codex_may_run:
    - help
    - dry_run
    - command_plan
    - cpu_tests
  codex_must_not_run:
    - real_inference
    - fid
    - long_gpu_jobs
jit_methods:
  - no_cache_50
  - bfc_quality_t02_08
  - bfc_speed_t02_10
  - reduced_steps_35
  - reduced_steps_30
deco_methods:
  - no_cache_50
  - bfc_all_candidates_t02_10
  - bfc_backbone_plus_final_t02_10
  - reduced_steps_35
  - reduced_steps_30
run_sizes:
  smoke: 100
  proxy_small: 1000
  proxy_large: 5000
  full: 50000
