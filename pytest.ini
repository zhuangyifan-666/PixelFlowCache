[pytest]
testpaths = tests
norecursedirs =
    .git
    .mypy_cache
    .pytest_cache
    __pycache__
    ckpts
    checkpoints
    data
    datasets
    logs
    outputs
    samples
    third_party
    wandb
markers =
    slow: long-running tests excluded from the fast suite
    cli: command-line subprocess tests
    integration: multi-component tests without real checkpoints or GPU inference
